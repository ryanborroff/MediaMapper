[package]
name = "media-mapper"
version = "0.1.0"
description = "Catalogue external drives and plan where files should live"
authors = ["ryanborroff"]
edition = "2021"

[lib]
name = "media_mapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
unicode-normalization = "0.1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
